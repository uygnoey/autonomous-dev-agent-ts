name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx tsc --noEmit

  lint:
    name: Biome Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx biome check src/

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun test tests/unit/
        timeout-minutes: 10

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Run coverage and capture output
        run: bun run test:coverage 2>&1 | tee coverage-output.txt || true
        timeout-minutes: 10
      - name: Check coverage threshold (soft gate, warn <70%)
        run: |
          # Parse "All files | XX.XX |" line from bun's text coverage output
          PCT=$(grep -E "^All files\s*\|" coverage-output.txt | awk -F'|' '{gsub(/ /,"",$2); print int($2)}' || echo "")
          if [ -n "$PCT" ] && [ "$PCT" -ge 0 ] 2>/dev/null; then
            echo "Line coverage: ${PCT}%"
            if [ "$PCT" -lt 70 ]; then
              echo "::warning::Coverage ${PCT}% is below the 70% soft gate. Please add more tests."
            else
              echo "Coverage ${PCT}% meets the 70% threshold."
            fi
          else
            echo "::warning::Could not determine coverage percentage. Check coverage-output.txt artifact."
          fi
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-output.txt
          retention-days: 30

  test-module:
    name: Module Tests
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun test tests/module/
        timeout-minutes: 10

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-unit, test-module]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bash scripts/test-lancedb.sh tests/e2e/
        timeout-minutes: 15

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - name: Verify dist output exists
        run: test -f dist/index.js
      - name: Verify no native .node binaries in dist
        run: |
          COUNT=$(find dist/ -name "*.node" | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "ERROR: found $COUNT native .node artifact(s) in dist/:"
            find dist/ -name "*.node"
            exit 1
          fi
          echo "OK: dist/ contains no .node artifacts"
      - name: Verify npm pack includes no .node assets
        run: |
          npm pack --dry-run 2>&1 | tee pack-out.txt
          if grep -q "\.node$" pack-out.txt; then
            echo "ERROR: npm tarball contains .node files:"
            grep "\.node$" pack-out.txt
            exit 1
          fi
          echo "OK: npm pack tarball contains no .node assets"

  declarations:
    name: TypeScript Declarations
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Build declarations
        run: bun run build:types
      - name: Verify .d.ts files for all public entrypoints
        run: |
          for f in dist/index.d.ts dist/core/index.d.ts dist/rag/index.d.ts dist/layer1/index.d.ts dist/layer2/index.d.ts dist/layer3/index.d.ts; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
            echo "OK: $f"
          done
      - name: Verify npm pack includes .d.ts
        run: |
          # Build JS artifacts first so pack doesn't fail on missing dist/
          bun run build
          npm pack --dry-run 2>&1 | tee pack-output.txt
          grep -E "\.d\.ts" pack-output.txt | head -10
          # Ensure at least the root .d.ts is listed
          grep "dist/index.d.ts" pack-output.txt || { echo "dist/index.d.ts not found in npm pack output"; exit 1; }
      - name: Consumer type-check (simulate TS import)
        run: |
          mkdir -p /tmp/ts-consumer
          cat > /tmp/ts-consumer/tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "strict": true,
              "moduleResolution": "bundler",
              "module": "ESNext",
              "noEmit": true,
              "paths": {
                "autonomous-dev-agent": ["${{ github.workspace }}/dist/index.d.ts"],
                "autonomous-dev-agent/core": ["${{ github.workspace }}/dist/core/index.d.ts"],
                "autonomous-dev-agent/rag": ["${{ github.workspace }}/dist/rag/index.d.ts"],
                "autonomous-dev-agent/layer1": ["${{ github.workspace }}/dist/layer1/index.d.ts"],
                "autonomous-dev-agent/layer2": ["${{ github.workspace }}/dist/layer2/index.d.ts"],
                "autonomous-dev-agent/layer3": ["${{ github.workspace }}/dist/layer3/index.d.ts"]
              }
            },
            "include": ["consumer.ts"]
          }
          EOF
          cat > /tmp/ts-consumer/consumer.ts <<'EOF'
          // Verify all public subpath exports resolve without TS errors
          import type {} from "autonomous-dev-agent";
          import type {} from "autonomous-dev-agent/core";
          import type {} from "autonomous-dev-agent/rag";
          import type {} from "autonomous-dev-agent/layer1";
          import type {} from "autonomous-dev-agent/layer2";
          import type {} from "autonomous-dev-agent/layer3";
          EOF
          cd /tmp/ts-consumer && bunx tsc --noEmit
